<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>维度表文件库 - 供应链信息库</title>
    <script src="./admin-guard.js?v=20260601-1"></script>
    <link rel="stylesheet" href="./styles.css?v=20260601-4" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="看板导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-wave wave-a"></span>
            <span class="brand-wave wave-b"></span>
            <span class="brand-wave wave-c"></span>
            <span class="brand-wave wave-d"></span>
          </span>
          <div>
            <strong>供应链信息库</strong>
            <span>维护人孙立柱</span>
          </div>
        </div>
        <nav class="nav-list">
          <a href="./index.html#overview">总览</a>
          <a href="./upload.html">供应商信息</a>
          <a href="./delivery.html">供应商交付信息</a>
          <a href="./domestic-stock.html">国内备货</a>
          <a href="./cross-border-stock.html">跨境备货</a>
          <a href="./admin.html">管理入口</a>
          <a href="./fact-library.html">备货事实表库</a>
          <a class="active" href="./file-library.html">维度表文件库</a>
        </nav>
      </aside>

      <main class="dashboard">
        <header class="topbar library-topbar">
          <div>
            <p class="eyebrow">匹配维度管理</p>
            <h1>维度表文件库</h1>
          </div>
          <button id="applyAllButton" class="primary-button" type="button" disabled>一键全部应用刷新</button>
        </header>

        <section class="panel library-page-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Dimension Files</p>
              <h2>月度维度表文件库</h2>
            </div>
            <span class="upload-state" id="libraryState">等待上传</span>
          </div>
          <div class="library-summary-grid">
            <div>
              <span>维度上限</span>
              <strong>8</strong>
            </div>
            <div>
              <span>已上传维度</span>
              <strong id="libraryCount">0</strong>
            </div>
            <div>
              <span>已应用维度</span>
              <strong id="appliedCount">0</strong>
            </div>
            <div>
              <span>最近更新</span>
              <strong id="libraryUpdatedAt">--</strong>
            </div>
          </div>
          <div class="maintainer-gate">
            <div>
              <span>替换权限</span>
              <strong id="maintainerState">仅维护人可替换文件</strong>
            </div>
            <label>
              <span>验证秘钥</span>
              <input id="maintainerCode" type="password" placeholder="请输入验证秘钥" autocomplete="off" />
            </label>
            <button id="unlockButton" type="button">启用替换</button>
          </div>
        </section>

        <section id="dimensionSlots" class="dimension-grid" aria-live="polite"></section>
      </main>
    </div>

    <script src="./shared-library.js?v=20260530-13"></script>
    <script src="./file-library.js?v=20260530-13"></script>
  </body>
</html>
