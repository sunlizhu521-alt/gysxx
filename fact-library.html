<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>供应链信息库</title>
    <link rel="stylesheet" href="./styles.css?v=20260605-3" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="看板导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-wave wave-a"></span>
            <span class="brand-wave wave-b"></span>
            <span class="brand-wave wave-c"></span>
            <span class="brand-wave wave-d"></span>
          </span>
          <div>
            <strong>供应链信息库</strong>
            <span>维护人孙立柱</span>
          </div>
        </div>
        <nav class="nav-list">
          <a href="./upload.html">采购分工信息</a>
          <a href="./delivery.html">供应商交付信息</a>
          <a href="./admin.html">文件库更新</a>
        </nav>
      </aside>

      <main class="dashboard">
        <header class="topbar library-topbar">
          <div>
            <p class="eyebrow">备货发货数据管理</p>
            <h1>备货事实表库</h1>
          </div>
          <button id="applyAllButton" class="primary-button" type="button" disabled>一键全部确认应用刷新</button>
        </header>

        <section class="panel library-page-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Fact Files</p>
              <h2>月度备货事实表库</h2>
            </div>
            <span class="upload-state" id="libraryState">等待上传</span>
          </div>
          <div class="library-summary-grid">
            <div>
              <span>事实表上限</span>
              <strong>8</strong>
            </div>
            <div>
              <span>已上传事实表</span>
              <strong id="libraryCount">0</strong>
            </div>
            <div>
              <span>已应用事实表</span>
              <strong id="appliedCount">0</strong>
            </div>
            <div>
              <span>最近更新</span>
              <strong id="libraryUpdatedAt">--</strong>
            </div>
          </div>
        </section>

        <section id="dimensionSlots" class="dimension-grid" aria-live="polite"></section>
      </main>
    </div>

    <script src="./fact-library.js?v=20260605-2"></script>
  </body>
</html>
