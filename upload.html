<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>供应商信息 - 供应链信息库</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="看板导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-wave wave-a"></span>
            <span class="brand-wave wave-b"></span>
            <span class="brand-wave wave-c"></span>
            <span class="brand-wave wave-d"></span>
          </span>
          <div>
            <strong>供应链信息库</strong>
            <span>维护人孙立柱</span>
          </div>
        </div>
        <nav class="nav-list">
          <a href="./index.html#overview">总览</a>
          <a class="active" href="./upload.html">供应商信息</a>
          <a href="./delivery.html">供应商交付信息</a>
          <a href="./domestic-stock.html">国内备货</a>
          <a href="./cross-border-stock.html">跨境备货</a>
          <a href="./fact-library.html">备货事实表库</a>
          <a href="./file-library.html">维度表文件库</a>
        </nav>
      </aside>

      <main class="dashboard">
        <header class="topbar">
          <div>
            <p class="eyebrow">Supplier Dashboard</p>
            <h1>供应商信息</h1>
          </div>
          <div class="toolbar" role="search">
            <label class="search-box">
              <span>搜索</span>
              <input id="supplierSearch" type="search" placeholder="供应商、物料、产品线、采购负责人" />
            </label>
            <select id="productLineFilter" aria-label="按产品线筛选">
              <option value="all">全部产品线</option>
            </select>
            <select id="ownerFilter" aria-label="按负责人筛选">
              <option value="all">全部负责人</option>
            </select>
          </div>
        </header>

        <section class="metrics-grid supplier-metrics" aria-label="供应商信息指标">
          <article class="metric">
            <span>供应商数量</span>
            <strong id="supplierCount">0</strong>
            <small>按供应商名称去重</small>
          </article>
          <article class="metric">
            <span>物料数量</span>
            <strong id="materialCount">0</strong>
            <small>按物料编码去重</small>
          </article>
          <article class="metric">
            <span>销售产品线</span>
            <strong id="productLineCount">0</strong>
            <small>来自采购分工明细</small>
          </article>
          <article class="metric alert">
            <span>待完善记录</span>
            <strong id="missingCount">0</strong>
            <small>供应商或物料字段为空</small>
          </article>
        </section>

        <section class="work-area supplier-work-area">
          <article class="panel chart-panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Product Line</p>
                <h2>产品线分布</h2>
              </div>
              <button id="resetButton" type="button">重置筛选</button>
            </div>
            <div id="productLineBars" class="bar-chart"></div>
          </article>

          <article class="panel actions-panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Owner Profile</p>
                <h2>采购负责人分布</h2>
              </div>
            </div>
            <div id="ownerBars" class="bar-chart compact-bars"></div>
          </article>
        </section>

        <section class="panel table-panel supplier-table-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Supplier Index</p>
              <h2>供应商信息明细</h2>
            </div>
            <span class="upload-state" id="recordState">等待数据</span>
          </div>
          <div class="table-wrap">
            <table class="supplier-table">
              <thead>
                <tr>
                  <th>供应商</th>
                  <th>物料编码</th>
                  <th>物料名称</th>
                  <th>销售产品线</th>
                  <th>采购负责人</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="supplierRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="./upload.js"></script>
  </body>
</html>
