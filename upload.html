<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>供应商信息 - 供应链信息库</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="看板导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-wave wave-a"></span>
            <span class="brand-wave wave-b"></span>
            <span class="brand-wave wave-c"></span>
            <span class="brand-wave wave-d"></span>
          </span>
          <div>
            <strong>供应链信息库</strong>
            <span>维护人孙立柱</span>
          </div>
        </div>
        <nav class="nav-list">
          <a href="./index.html#overview">总览</a>
          <a class="active" href="./upload.html">供应商信息</a>
          <a href="./delivery.html">供应商交付信息</a>
          <a href="./file-library.html">维度表文件库</a>
        </nav>
      </aside>

      <main class="dashboard">
        <header class="topbar">
          <div>
            <p class="eyebrow">供应商资料入口</p>
            <h1>供应商信息</h1>
          </div>
        </header>

        <section class="panel upload-panel upload-page-panel" id="upload">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Upload Source</p>
              <h2>供应商信息上传入口</h2>
            </div>
            <span class="upload-state" id="uploadState">等待上传</span>
          </div>
          <div class="upload-layout">
            <label class="upload-dropzone" id="uploadDropzone">
              <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" />
              <span class="upload-icon">↑</span>
              <strong>选择或拖入供应商信息文件</strong>
              <small>支持 Excel 和 CSV。文件只在本地浏览器中读取，后续供应商看板分析从这里开始。</small>
            </label>
            <div class="upload-summary" aria-live="polite">
              <div>
                <span>文件名</span>
                <strong id="fileName">未选择</strong>
              </div>
              <div>
                <span>文件大小</span>
                <strong id="fileSize">--</strong>
              </div>
              <div>
                <span>文件类型</span>
                <strong id="fileType">--</strong>
              </div>
              <div>
                <span>应用状态</span>
                <strong id="applyStatus">未应用</strong>
              </div>
              <div class="upload-actions">
                <button id="applyButton" type="button" disabled>应用文件</button>
                <button id="deleteButton" class="danger-button" type="button" disabled>删除文件</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./upload.js"></script>
  </body>
</html>
