<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>交付信息-金蝶导出 - 供应链信息库</title>
    <link rel="stylesheet" href="./styles.css?v=20260610-14" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="看板导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-wave wave-a"></span>
            <span class="brand-wave wave-b"></span>
            <span class="brand-wave wave-c"></span>
            <span class="brand-wave wave-d"></span>
          </span>
          <div>
            <strong>供应链信息库</strong>
            <span>维护人孙立柱</span>
          </div>
        </div>
        <nav class="nav-list">
          <a href="./purchase.html">采购分工信息</a>
          <a href="./delivery.html">交付信息-手工登记</a>
          <a class="active" href="./delivery-kingdee.html">交付信息-金蝶导出</a>
          <a href="./kingdee-purchase-compare.html">金蝶采购订单对比</a>
          <a href="./order-change.html">订单变更</a>
          <a href="./admin.html">文件库更新</a>
          <a href="./missing.html">信息缺失</a>
        </nav>
      </aside>

      <main class="dashboard delivery-dashboard">
        <header class="topbar">
          <div>
            <p class="eyebrow">Supplier Delivery</p>
            <h1>交付信息-金蝶导出</h1>
            <small class="source-note" id="deliverySourceNote">数据来源：本地文件库｜引用时间：--</small>
          </div>
        </header>

        <section class="panel delivery-filter-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Filters</p>
              <h2>筛选条件</h2>
            </div>
            <button id="deliveryResetButton" type="button">重置筛选</button>
          </div>
          <div class="delivery-filter-bar" id="deliveryFilterBar">
            <div class="multi-filter" id="businessUnitFilter" data-filter-key="businessUnit"></div>
            <div class="multi-filter" id="salesLineFilter" data-filter-key="salesLine"></div>
            <div class="multi-filter" id="salesSeriesFilter" data-filter-key="salesSeries"></div>
            <div class="multi-filter" id="modelFilter" data-filter-key="model"></div>
            <div class="multi-filter" id="purchaseGroupFilter" data-filter-key="purchaseGroup"></div>
            <div class="multi-filter" id="orderUserFilter" data-filter-key="orderUser"></div>
            <div class="multi-filter" id="supplierShortFilter" data-filter-key="supplierShort"></div>
            <div class="multi-filter" id="dateFilter" data-filter-key="dateRange"></div>
            <div class="multi-filter" id="stockAgeFilter" data-filter-key="stockAge"></div>
          </div>
        </section>

        <section class="metrics-grid delivery-metrics" aria-label="供应商交付指标">
          <article class="metric">
            <span>下单数量</span>
            <strong id="orderedQty">0</strong>
            <small>当前筛选范围内汇总</small>
          </article>
          <article class="metric">
            <span>已发货数量</span>
            <strong id="shippedQty">0</strong>
            <small>当前筛选范围内汇总</small>
          </article>
          <article class="metric">
            <span>剩余数量</span>
            <strong id="remainingQty">0</strong>
            <small>下单数量减已发货数量</small>
          </article>
          <article class="metric alert">
            <span>库存超60天数量</span>
            <strong id="over60Qty">0</strong>
            <small>按匹配字段汇总</small>
          </article>
        </section>

        <section class="panel table-panel delivery-table-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Open Orders</p>
              <h2>供应商未交付明细</h2>
            </div>
            <div class="delivery-heading-actions">
              <button id="deliveryDownloadButton" type="button" disabled>下载明细</button>
              <span class="upload-state" id="deliveryState">等待数据</span>
            </div>
          </div>
          <div class="table-wrap delivery-table-wrap">
            <table class="delivery-table">
              <thead>
                <tr>
                  <th><div class="table-column-filter" id="supplierShortColumnFilter" data-detail-filter-key="supplierShort"></div></th>
                  <th><div class="table-column-filter" id="materialCodeColumnFilter" data-detail-filter-key="materialCode"></div></th>
                  <th><div class="table-column-filter" id="skuColumnFilter" data-detail-filter-key="sku"></div></th>
                  <th><div class="table-column-filter" id="itemNameColumnFilter" data-detail-filter-key="itemName"></div></th>
                  <th><div class="table-column-filter" id="orderedQtyColumnFilter" data-detail-filter-key="orderedQty"></div></th>
                  <th><div class="table-column-filter" id="remainingQtyColumnFilter" data-detail-filter-key="remainingQty"></div></th>
                </tr>
              </thead>
              <tbody id="deliveryRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="./vendor/xlsx.full.min.js?v=20260601-1"></script>
    <script src="./delivery-kingdee.js?v=20260617-1"></script>
  </body>
</html>
