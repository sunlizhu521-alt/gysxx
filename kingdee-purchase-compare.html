<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>金蝶采购订单对比 - 供应链信息库</title>
    <link rel="stylesheet" href="./styles.css?v=20260608-13" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="看板导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-wave wave-a"></span>
            <span class="brand-wave wave-b"></span>
            <span class="brand-wave wave-c"></span>
            <span class="brand-wave wave-d"></span>
          </span>
          <div>
            <strong>供应链信息库</strong>
            <span>维护人孙立柱</span>
          </div>
        </div>
        <nav class="nav-list">
          <a href="./purchase.html">采购分工信息</a>
          <a href="./delivery.html">供应商交付信息</a>
          <a class="active" href="./kingdee-purchase-compare.html">金蝶采购订单对比</a>
          <a href="./order-change.html">订单变更</a>
          <a href="./admin.html">文件库更新</a>
          <a href="./missing.html">信息缺失</a>
        </nav>
      </aside>

      <main class="dashboard kingdee-compare-dashboard">
        <header class="topbar">
          <div>
            <p class="eyebrow">Kingdee Purchase Orders</p>
            <h1>金蝶采购订单对比</h1>
            <small class="source-note" id="kingdeeCompareSourceNote">数据来源：本地文件库｜引用时间：--</small>
          </div>
        </header>

        <section class="panel kingdee-filter-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Filters</p>
              <h2>筛选条件</h2>
            </div>
            <button id="kingdeeResetButton" type="button">重置筛选</button>
          </div>
          <div class="kingdee-filter-bar" id="kingdeeFilterBar">
            <label class="search-box kingdee-search-box">
              <span>搜索</span>
              <input id="kingdeeSearch" type="search" placeholder="单据编号、物料编码、SKU、物料名称、供应商" />
            </label>
            <div class="multi-filter" id="orderUserCompareFilter" data-filter-key="orderUser"></div>
            <div class="multi-filter" id="businessUnitCompareFilter" data-filter-key="businessUnit"></div>
            <div class="multi-filter" id="supplierShortCompareFilter" data-filter-key="supplierShort"></div>
            <div class="multi-filter" id="salesLineCompareFilter" data-filter-key="salesLine"></div>
            <div class="multi-filter" id="salesSeriesCompareFilter" data-filter-key="salesSeries"></div>
            <div class="multi-filter" id="compareMetricFilter" data-filter-key="compareMetric"></div>
          </div>
        </section>

        <section class="metrics-grid kingdee-compare-metrics" aria-label="金蝶采购订单对比指标">
          <article class="metric">
            <span>下单数量有差异的单据数量</span>
            <strong id="orderedDiffDocumentCount">0</strong>
            <small>按当前筛选结果的单据编号去重</small>
          </article>
          <article class="metric alert">
            <span>剩余数量有差异的单据数量</span>
            <strong id="remainingDiffDocumentCount">0</strong>
            <small>按当前筛选结果的单据编号去重</small>
          </article>
        </section>

        <section class="panel table-panel kingdee-table-panel">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Data Compare</p>
              <h2>数据对比</h2>
            </div>
            <div class="table-actions" id="kingdeeTableActions">
              <div class="multi-filter" id="differenceStatusCompareFilter" data-filter-key="differenceStatus"></div>
              <button id="kingdeeDownloadButton" type="button" disabled>下载当前结果</button>
              <span class="upload-state" id="kingdeeCompareState">等待数据</span>
            </div>
          </div>
          <div class="table-wrap kingdee-table-wrap">
            <table class="kingdee-compare-table">
              <thead>
                <tr>
                  <th>事业部</th>
                  <th>单据编号</th>
                  <th>供应商简称</th>
                  <th>物料编码</th>
                  <th>SKU</th>
                  <th>物料名称</th>
                  <th id="kingdeeDataHeader">下单数量-金蝶数据</th>
                  <th id="undeliveredDataHeader">下单数量-未交付表数据</th>
                  <th id="differenceDataHeader">下单数量-差异数据</th>
                </tr>
              </thead>
              <tbody id="kingdeeCompareRows">
                <tr><td colspan="9" class="empty-table-cell">等待数据来源规则</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="./vendor/xlsx.full.min.js?v=20260601-1"></script>
    <script src="./kingdee-purchase-compare-cache-only.js?v=20260608-5"></script>
  </body>
</html>
